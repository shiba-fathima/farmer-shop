<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - AgriRent</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <nav class="navbar">
        <a href="/" class="logo">
            <i class="fa-solid fa-tractor"></i> AgriRent
        </a>
        <ul class="nav-links">
            <li><a href="/">Home</a></li>
            <li><a href="/login" class="btn-login">Login</a></li>
        </ul>
    </nav>

    <div class="container auth-container">
        <div class="auth-card">
            <h2 class="auth-title">Welcome Farmer</h2>
            <form action="/login" method="POST">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" placeholder="Enter username" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Enter password (any for demo)" required>
                </div>
                <button type="submit" class="btn-primary btn-block" style="margin-top:20px; width: 100%; border-radius: 6px;">Login</button>
            </form>
        </div>
    </div>
</body>
</html>
